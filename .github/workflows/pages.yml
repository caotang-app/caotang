# Builds the web app and deploys apps/desktop/dist to GitHub Pages: the local-only version at caotang.app.
#
# GitHub Pages must be enabled for the repository (Settings › Pages › Source: GitHub Actions) when the repository goes
# public; until then the deploy step has nowhere to publish and this workflow fails at that step. The build is the same
# `pnpm build` CI runs, so what is deployed is what CI checked. The CSP travels in the build's index.html.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The least the deploy needs: read the code, write the Pages site, and prove its identity to Pages with an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/desktop/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
